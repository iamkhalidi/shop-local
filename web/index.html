<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shop_local">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>shop local</title>
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/icon?family=Material+Icons">

  <style>
    /* تقليل استهلاك الذاكرة عبر منع الفليكر في الخطوط */
    body {
      background-color: #FAFAFA;
    }
    /* إخفاء شريط التحميل الافتراضي لتقليل الجهد البصري */
    .flutter-loader {
      display: none;
    }
  </style>
</head>
<body>
  <script>
    {{flutter_bootstrap_js}}

    window.addEventListener('load', function(ev) {
      // 🚀 تهيئة متقدمة لفرض الـ HTML Renderer وتعطيل CanvasKit تماماً
      _flutter.loader.load({
        onEntrypointLoaded: async function(engineInitializer) {
          const appRunner = await engineInitializer.initializeEngine({
            renderer: "html",
            useColorEmoji: false,
          });

          // 🛠️ منع المتصفح من استهلاك الذاكرة في تحميل خطوط Noto المفقودة
          if (window.flutterCanvasKit) {
             window.flutterCanvasKit.fontLoading = false;
          }

          await appRunner.runApp();
        }
      });
    });
  </script>
</body>
</html>
